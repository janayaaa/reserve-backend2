{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReServe — Set New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-[#F4F8F6] min-h-screen flex items-center justify-center p-4 antialiased text-[#12372C]">
  <div class="bg-white rounded-2xl border border-[#DCE5DF] shadow-xl w-full max-w-md p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="mx-auto w-12 h-12 rounded-2xl bg-[#1B4D3E] text-white flex items-center justify-center shadow-xs">
        <i data-lucide="key-round" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-bold text-[#12372C] tracking-tight">Reset Your Password</h1>
      <p class="text-xs text-[#4F695D]">
        Setting a new password for <span class="font-semibold text-[#1B4D3E]">{{ email|default:"your RESERVE account" }}</span>
      </p>
    </div>

    <form id="resetPwForm" class="space-y-4">
      <input type="hidden" id="resetToken" value="{{ token }}">
      <div>
        <label class="block text-[11px] font-semibold text-[#12372C] mb-1.5">New Password *</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password"
          class="w-full px-4 py-2.5 bg-[#F7F9F7] border border-[#DCE5DF] rounded-xl text-xs font-medium focus:outline-none focus:border-[#1B4D3E] focus:bg-white">
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-[#12372C] mb-1.5">Confirm New Password *</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter new password"
          class="w-full px-4 py-2.5 bg-[#F7F9F7] border border-[#DCE5DF] rounded-xl text-xs font-medium focus:outline-none focus:border-[#1B4D3E] focus:bg-white">
      </div>

      <div id="resetStatusBox" class="hidden rounded-xl p-3 text-xs font-semibold"></div>

      <button type="submit" id="resetSubmitBtn"
        class="w-full bg-[#3A826D] hover:bg-[#1B4D3E] text-white font-semibold text-xs py-3 rounded-xl transition-all">
        Update Password
      </button>
    </form>

    <div class="text-center pt-3 border-t border-[#DCE5DF]">
      <a href="/login/" class="text-xs font-semibold text-[#3A826D] hover:text-[#1B4D3E]">← Return to Login</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();

      const form = document.getElementById('resetPwForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = document.getElementById('resetToken').value;
        const new_password = document.getElementById('newPassword').value;
        const confirm_password = document.getElementById('confirmPassword').value;
        const statusBox = document.getElementById('resetStatusBox');
        const btn = document.getElementById('resetSubmitBtn');

        statusBox.classList.add('hidden');
        if (new_password !== confirm_password) {
          statusBox.textContent = "Passwords do not match. Please check and try again.";
          statusBox.className = "rounded-xl p-3 text-xs font-semibold bg-[#FBE4E1] text-[#B3261E] border border-[#B3261E]/30";
          return;
        }

        btn.textContent = "Updating Password...";
        btn.disabled = true;

        try {
          const res = await fetch('/api/accounts/reset-password-confirm/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password, confirm_password })
          });
          const data = await res.json();
          if (res.ok) {
            statusBox.textContent = data.message || "Password updated successfully!";
            statusBox.className = "rounded-xl p-3 text-xs font-semibold bg-[#E4F0E8] text-[#1F6B52] border border-emerald-200";
            btn.textContent = "Password Updated ✓";
          } else {
            statusBox.textContent = data.error || "Could not reset password.";
            statusBox.className = "rounded-xl p-3 text-xs font-semibold bg-[#FBE4E1] text-[#B3261E] border border-[#B3261E]/30";
            btn.textContent = "Update Password";
            btn.disabled = false;
          }
        } catch (err) {
          statusBox.textContent = "Network error while resetting password.";
          statusBox.className = "rounded-xl p-3 text-xs font-semibold bg-[#FBE4E1] text-[#B3261E] border border-[#B3261E]/30";
          btn.textContent = "Update Password";
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
